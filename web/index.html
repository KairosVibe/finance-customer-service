<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中州银行智能客服 · 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111827; --ink-light:#374151; --ink-mid:#6b7280; --ink-faint:#9ca3af;
    --paper:#f7f5f2; --paper-deep:#efede8; --paper-warm:#f0ece4;
    --surface:#ffffff; --surface-raised:#faf9f7;
    --rule:#e5e0d8; --rule-light:#f0ece4;
    --brand:#1a3a5c; --brand-light:#2d5278;
    --accent:#8b6914; --accent-soft:#f5f0e3; --accent-rule:#e8dfc8;
    --success:#1a6b4a; --success-soft:#ecf5ef; --success-rule:#c8e0d4;
    --warn:#92550e; --warn-soft:#fdf4e0; --warn-rule:#f0dbb8;
    --danger:#b91c1c; --danger-soft:#fdf0f0;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sans:"Outfit",system-ui,sans-serif;
    --serif:"Newsreader","Noto Serif SC","Source Han Serif CN","SimSun",serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --r-sm:6px; --r-md:10px; --r-lg:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    background-image:radial-gradient(ellipse 80% 60% at 80% -10%,rgba(26,58,92,.05) 0%,transparent 60%),
                     radial-gradient(ellipse 50% 40% at -10% 60%,rgba(139,105,20,.04) 0%,transparent 50%)}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:rgba(26,58,92,.12)}

  /* ── topbar ── */
  .topbar{
    display:flex;align-items:center;gap:18px;padding:0 28px;
    height:60px;
    background:rgba(247,245,242,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:20;
  }
  .topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .logo-mark{
    width:36px;height:36px;
    background:var(--brand);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--serif);font-weight:700;font-size:17px;
    position:relative;flex:0 0 auto;
  }
  .logo-mark::before{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.15);border-radius:inherit}
  .logo-mark::after{content:'';position:absolute;inset:-3px;border:1px solid rgba(26,58,92,.12);border-radius:50%;pointer-events:none}
  .brand-text{display:flex;flex-direction:column;gap:1px}
  .brand-name{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.02em;line-height:1.2}
  .brand-sub{font-size:10.5px;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .topbar .spacer{flex:1}
  .status-pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:500;color:var(--success);
    letter-spacing:.04em;
    padding:5px 11px;border-radius:999px;
    background:var(--success-soft);border:1px solid var(--success-rule);
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(26,107,74,.12)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
  .status-dot{animation:breathe 2.8s ease-in-out infinite}
  .customer-box{display:flex;align-items:center;gap:8px}
  .input-field{
    padding:7px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);
    font-size:13px;color:var(--ink);background:var(--surface);
    outline:none;transition:border-color .2s,box-shadow .2s;
    width:148px;
  }
  .input-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,58,92,.08)}
  .input-field::placeholder{color:var(--ink-faint)}

  /* ── buttons ── */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border:none;border-radius:var(--r-sm);padding:8px 16px;
    font-size:13px;font-weight:500;letter-spacing:.02em;
    transition:transform .15s var(--ease),box-shadow .2s,background .15s,opacity .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    background:var(--brand);color:#fff;
    box-shadow:0 1px 3px rgba(17,24,39,.12),0 1px 2px rgba(17,24,39,.06);
  }
  .btn-primary:hover{background:var(--brand-light);box-shadow:0 4px 14px rgba(26,58,92,.18)}
  .btn-ghost{
    background:transparent;color:var(--ink-mid);
    border:1px solid var(--rule);
  }
  .btn-ghost:hover{background:var(--paper-deep);color:var(--ink);border-color:#d4cec4}
  .btn svg{width:15px;height:15px;flex:0 0 auto}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

  /* ── layout ── */
  .app{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:12px;padding:14px 18px;height:calc(100vh - 60px);
    background-image:url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='.5' fill='%23d4cec4' opacity='.3'/%3E%3C/svg%3E")}
  .panel{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--r-lg);
    display:flex;flex-direction:column;overflow:hidden;min-height:0;
    box-shadow:0 1px 3px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.03);
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--rule);
    background:var(--surface-raised);
  }
  .panel-title{
    font-family:var(--serif);font-size:13px;font-weight:600;
    color:var(--ink);letter-spacing:.03em;
    display:flex;align-items:center;gap:8px;
  }
  .panel-title svg{width:15px;height:15px;color:var(--brand);stroke-width:1.8}
  .count-badge{
    font-family:var(--mono);font-size:10.5px;font-weight:500;
    color:var(--ink-faint);background:var(--paper);
    border:1px solid var(--rule);border-radius:999px;
    padding:2px 7px;letter-spacing:.04em;
  }

  /* ── left: sessions ── */
  .sessions{flex:1;overflow-y:auto;padding:8px 10px 12px}
  .search-wrap{padding:8px 10px 8px;border-bottom:1px solid var(--rule-light)}
  .search-input{
    width:100%;padding:7px 12px 7px 30px;
    border:1px solid var(--rule);border-radius:var(--r-sm);
    font-size:12.5px;color:var(--ink);background:var(--paper);
    outline:none;transition:border-color .2s,background .2s;
  }
  .search-input:focus{border-color:var(--brand);background:var(--surface)}
  .search-input::placeholder{color:var(--ink-faint)}
  .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);
    width:13px;height:13px;color:var(--ink-faint);pointer-events:none}
  .search-wrap{position:relative}
  .session-item{
    width:100%;text-align:left;border:none;background:transparent;
    border-radius:var(--r-md);padding:10px 12px;margin-bottom:4px;
    display:flex;gap:10px;align-items:center;cursor:pointer;
    border:1px solid transparent;
    transition:background .15s var(--ease),border-color .15s;
  }
  .session-item:hover{background:var(--paper);border-color:var(--rule)}
  .session-item.active{background:var(--paper-warm);border-color:var(--accent-rule)}
  .session-item.active::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;
    background:var(--accent);border-radius:0 2px 2px 0}
  .session-item{position:relative}
  .sess-avatar{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:12px;font-weight:600;
    color:#fff;background:var(--brand);
    letter-spacing:.05em;
  }
  .sess-body{flex:1;min-width:0}
  .sess-title{font-size:13px;font-weight:500;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess-time{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.02em}
  .empty-tip{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:36px 16px;line-height:2;
    font-style:italic;font-family:var(--serif)}

  /* ── center: chat ── */
  .chat-head{
    padding:12px 20px;border-bottom:1px solid var(--rule);
    display:flex;align-items:center;gap:14px;background:var(--surface-raised);
  }
  .bot-avatar{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:16px;font-weight:700;
    color:#fff;background:var(--brand);position:relative;
  }
  .bot-avatar::after{content:'';position:absolute;bottom:-1px;right:-1px;
    width:11px;height:11px;border-radius:50%;background:#1a8a5c;
    border:2px solid var(--surface)}
  .chat-info .who{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .chat-info .sid{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:1px;letter-spacing:.04em}
  .messages{
    flex:1;overflow-y:auto;padding:24px 28px;
    display:flex;flex-direction:column;gap:18px;
    scroll-behavior:smooth;
    background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 20h40M20 0v40' stroke='%23e5e0d8' stroke-width='.5' fill='none' opacity='.4'/%3E%3C/svg%3E");
    background-size:40px 40px;
  }
  .welcome{max-width:560px;margin:10vh auto 0;text-align:center;padding:0 12px}
  .welcome-mark{
    width:68px;height:68px;border-radius:50%;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:28px;font-weight:700;
    color:#fff;background:var(--brand);position:relative;
    box-shadow:0 4px 20px rgba(26,58,92,.2),0 0 0 6px rgba(26,58,92,.04);
  }
  .welcome h2{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:.01em;margin-bottom:10px}
  .welcome p{color:var(--ink-mid);font-size:14px;margin:0 auto 24px;line-height:1.75;max-width:440px;font-family:var(--serif)}
  .trust-row{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
  .trust-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;color:var(--ink-mid);font-weight:500;
    background:var(--surface);border:1px solid var(--rule);
    border-radius:999px;padding:5px 11px;
    letter-spacing:.02em;
  }
  .trust-pill svg{width:12px;height:12px;stroke-width:1.8;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{
    background:var(--surface);border:1px solid var(--rule);
    border-radius:999px;padding:7px 16px;font-size:13px;color:var(--ink);
    transition:all .18s var(--ease);letter-spacing:.01em;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand);background:rgba(26,58,92,.03);
    transform:translateY(-1px);box-shadow:0 2px 8px rgba(26,58,92,.08)}
  .msg{display:flex;gap:10px;max-width:76%;animation:rise .3s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .m-avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:12px;font-weight:600;color:#fff;
    background:var(--brand);margin-top:2px}
  .msg .m-col{display:flex;flex-direction:column;min-width:0;gap:3px}
  .msg .m-bubble{
    background:var(--surface);border:1px solid var(--rule);
    border-radius:2px 14px 14px 14px;padding:11px 16px;
    font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(17,24,39,.03);
  }
  .msg.user{flex-direction:row-reverse;align-self:flex-end}
  .msg.user .m-avatar{background:var(--accent);order:2}
  .msg.user .m-bubble{
    background:var(--brand);color:#fff;border:none;
    border-radius:14px 2px 14px 14px;
    box-shadow:0 2px 12px rgba(26,58,92,.18);
  }
  .msg .m-time{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.03em}
  .msg.user .m-time{text-align:right}
  .typing-cursor{display:inline-block;width:2px;height:13px;background:var(--brand);
    animation:blink .9s step-end infinite;vertical-align:-1px;margin-left:1px;border-radius:1px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .tool-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent-soft);color:var(--accent);
    border:1px solid var(--accent-rule);border-radius:var(--r-sm);
    padding:4px 10px;font-size:11px;font-weight:500;margin-top:6px;
    font-family:var(--mono);letter-spacing:.03em;
  }
  .composer{padding:14px 20px;border-top:1px solid var(--rule);background:var(--surface-raised)}
  .composer-row1{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .action-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:500;color:var(--brand);
    background:rgba(26,58,92,.05);border:1px solid rgba(26,58,92,.15);
    border-radius:999px;padding:5px 12px;transition:all .15s;
  }
  .action-btn:hover{background:rgba(26,58,92,.1);border-color:rgba(26,58,92,.25)}
  .action-btn svg{width:13px;height:13px;stroke-width:1.8}
  .composer-hint{font-size:11px;color:var(--ink-faint);letter-spacing:.02em}
  .composer-row2{display:flex;gap:10px;align-items:flex-end}
  .composer textarea{
    flex:1;resize:none;border:1px solid var(--rule);border-radius:var(--r-md);
    padding:11px 14px;font-size:14px;line-height:1.6;outline:none;max-height:110px;
    background:var(--surface);color:var(--ink);
    transition:border-color .2s,box-shadow .2s;
  }
  .composer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,58,92,.07)}
  .composer textarea::placeholder{color:var(--ink-faint)}
  .send-btn{
    width:44px;height:44px;border-radius:var(--r-md);border:none;
    background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s var(--ease);flex:0 0 auto;
    box-shadow:0 2px 8px rgba(26,58,92,.2);
  }
  .send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,58,92,.28)}
  .send-btn:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}
  .send-btn svg{width:18px;height:18px;stroke-width:2}
  .send-btn .spinner{
    width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .65s linear infinite;display:none;
  }
  .send-btn.loading .arrow-icon{display:none}
  .send-btn.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* debug panel */
  .debug-panel{background:var(--paper);border-top:1px solid var(--rule)}
  .debug-head{
    display:flex;align-items:center;gap:8px;padding:9px 18px;
    cursor:pointer;user-select:none;font-family:var(--mono);font-size:11px;font-weight:500;
    color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;
    transition:color .15s;
  }
  .debug-head:hover{color:var(--ink-mid)}
  .debug-body{padding:0 18px 10px;display:none;max-height:130px;overflow-y:auto}
  .debug.open .debug-body{display:block}
  .debug-line{font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--ink-mid);
    padding:2px 0;word-break:break-all;border-bottom:1px solid var(--rule-light)}
  .debug-line:last-child{border-bottom:none}
  .debug-tag{color:var(--accent);font-weight:500}
  .debug-arrow{transition:transform .2s}
  .debug.open .debug-arrow{transform:rotate(90deg)}

  /* ── right: state ── */
  .state-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .state-card{
    border:1px solid var(--rule);border-radius:var(--r-md);
    background:var(--surface-raised);
    transition:box-shadow .2s;
  }
  .state-card:hover{box-shadow:0 2px 8px rgba(17,24,39,.05)}
  .state-card-head{
    font-family:var(--mono);font-size:10px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);padding:10px 14px 0;
    display:flex;align-items:center;gap:7px;
  }
  .state-card-head svg{width:13px;height:13px;stroke-width:1.8}
  .state-card-body{padding:10px 14px 14px}
  .kv-row{display:flex;justify-content:space-between;align-items:center;
    padding:6px 0;border-bottom:1px solid var(--rule-light);font-size:12.5px}
  .kv-row:last-child{border-bottom:none}
  .kv-k{color:var(--ink-faint);font-size:12px}
  .kv-v{font-weight:500;color:var(--ink);word-break:break-all;text-align:right;font-size:12.5px}
  .kv-v.ok{color:var(--success)}
  .kv-v.warn{color:var(--warn)}
  .flow-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--paper-warm);border:1px solid var(--accent-rule);
    color:var(--accent);border-radius:var(--r-sm);
    padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;
    font-family:var(--serif);
  }
  .slots-wrap{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .slot-chip{
    display:inline-flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--rule);
    border-radius:var(--r-sm);padding:5px 10px;font-size:11.5px;
    transition:border-color .15s,background .15s;
  }
  .slot-chip .sl{color:var(--ink-faint);font-size:10.5px;line-height:1.3}
  .slot-chip .sv{font-weight:600;margin-top:1px;word-break:break-all;line-height:1.3;font-size:11.5px}
  .slot-chip.filled{border-color:var(--success-rule);background:var(--success-soft)}
  .slot-chip.filled .sl{color:var(--success)}
  .slot-chip.pending{border-style:dashed;border-color:var(--warn-rule);background:var(--warn-soft)}
  .slot-chip.pending .sl{color:var(--warn)}
  .empty-state{color:var(--ink-faint);font-size:12px;text-align:center;padding:12px;line-height:1.8;font-style:italic}
  .cust-header{display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .cust-avatar{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:14px;font-weight:600;color:#fff;
    background:var(--brand);
  }
  .cust-name{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink)}
  .cust-id{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:1px;letter-spacing:.04em}

  /* scrollbar */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:1100px){.app{grid-template-columns:240px minmax(0,1fr)}.right{display:none}}
  @media(max-width:760px){.app{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 60px)}.left{display:none}.topbar .customer-box{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="#">
    <div class="logo-mark">州</div>
    <div class="brand-text">
      <div class="brand-name">中州银行</div>
      <div class="brand-sub">智能客服系统</div>
    </div>
  </a>
  <div class="spacer"></div>
  <span class="status-pill"><span class="status-dot"></span>服务运行中</span>
  <div class="customer-box">
    <input class="input-field" id="customerNo" value="CUS00000001" placeholder="客户号" title="客户号">
    <button class="btn btn-primary" onclick="newSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建会话
    </button>
  </div>
</div>

<div class="app">
  <!-- 左：会话列表 -->
  <div class="panel left">
    <div class="panel-head">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        会话记录
      </div>
      <span class="count-badge" id="sessionCount"></span>
    </div>
    <div class="search-wrap" style="padding:8px 10px 8px;border-bottom:1px solid var(--rule-light)">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="sessionSearch" placeholder="搜索会话 ID…" oninput="filterSessions(this.value)">
    </div>
    <div class="sessions" id="sessionList">
      <div class="empty-tip">输入客户号后<br>点击右上角新建会话</div>
    </div>
  </div>

  <!-- 中：聊天 -->
  <div class="panel">
    <div class="chat-head">
      <div class="bot-avatar">州</div>
      <div class="chat-info">
        <div class="who">中州银行智能客服</div>
        <div class="sid" id="sidLabel">—</div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="refreshState()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新状态
      </button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-row1">
        <button class="action-btn" onclick="sendObject('bank_card','6222000000000000001','储蓄卡尾号0001','ACC0000000001')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          插入银行卡
        </button>
        <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
      </div>
      <div class="composer-row2">
        <textarea id="msgInput" rows="1" placeholder="请输入您的问题…" onkeydown="onKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()" title="发送">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          <div class="spinner"></div>
        </button>
      </div>
    </div>
    <div class="debug-panel" id="debug">
      <div class="debug-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="debug-arrow">▶</span> 调试轨迹
      </div>
      <div class="debug-body">
        <div class="debug-line" style="color:var(--ink-faint)">发送消息后在此查看全链路轨迹。</div>
      </div>
    </div>
  </div>

  <!-- 右：会话状态 -->
  <div class="panel right">
    <div class="panel-head">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 6v4l3 3"/></svg>
        会话状态
      </div>
    </div>
    <div class="state-body" id="statePanel">
      <div class="empty-state">新建会话后<br>此处实时展示任务与槽位</div>
    </div>
  </div>
</div>

<script>
const FLOW_NAMES={account_query:"账户查询",transaction_query:"交易查询",loan_apply:"贷款申请",card_loss_report:"信用卡挂失",complaint_ticket:"投诉工单"};
const SLOT_LABELS={account_no:"账户号/卡号",tx_date:"交易日期",product_code:"贷款产品",apply_amount:"贷款金额",apply_term_months:"贷款期限",repayment_method:"还款方式",loan_purpose:"贷款用途",card_no:"信用卡号",loss_reason:"挂失原因",identity_info:"身份验证",ticket_type:"工单类型",transaction_no:"关联交易号",description:"问题描述",confirm:"确认"};
const SUGGEST=["查一下账户余额","查最近交易","理财产品推荐","我要申请消费贷款","我的信用卡丢了","转账没到账"];
let currentSession=null,reqSeq=0,streaming=false;

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nowTime(){return new Date().toTimeString().slice(0,5);}
function timeAgo(ts){
  if(!ts)return '—';
  const d=new Date(ts.replace(' ','T')),now=new Date(),diff=Math.floor((now-d)/1000);
  if(diff<60)return '刚刚';if(diff<3600)return Math.floor(diff/60)+'m前';
  if(diff<86400)return Math.floor(diff/3600)+'h前';return Math.floor(diff/86400)+'d前';
}
function log(msg){
  const d=$('debug'),body=d.querySelector('.debug-body');
  const line=document.createElement('div');line.className='debug-line';line.innerHTML=msg;
  body.appendChild(line);d.classList.add('open');body.scrollTop=body.scrollHeight;
}

async function api(url,opts={}){
  const rid='web-'+Date.now()+'-'+(++reqSeq);
  const res=await fetch(url,Object.assign({headers:{'Content-Type':'application/json','X-Request-Id':rid}},opts));
  const json=await res.json();
  if(json.code!==0)throw new Error(json.message||('HTTP '+res.status));
  return json;
}

function renderWelcome(){
  const m=$('messages');m.innerHTML='';
  const w=document.createElement('div');w.className='welcome';
  w.innerHTML=
    '<div class="welcome-mark">州</div>'+
    '<h2>中州银行智能客服</h2>'+
    '<p>账户查询 · 交易明细 · 贷款申请 · 卡片挂失 · 投诉工单</p>'+
    '<div class="trust-row">'+
      '<span class="trust-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>金融级安全</span>'+
      '<span class="trust-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>人工兜底</span>'+
      '<span class="trust-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>实时在线</span>'+
    '</div>'+
    '<div class="chips">'+SUGGEST.map(s=>'<button class="chip" onclick="sendText(\''+s+'\')">'+s+'</button>').join('')+'</div>';
  m.appendChild(w);
}
function sendText(t){$('msgInput').value=t;send();}

function addMsg(sender,text,streaming){
  const box=$('messages');
  if(!box.dataset.hasMsg){box.innerHTML='';box.dataset.hasMsg='1';}
  const wrap=document.createElement('div');wrap.className='msg '+(sender==='user'?'user':'bot');
  const av=document.createElement('div');av.className='m-avatar';av.textContent=sender==='user'?'我':'州';
  const col=document.createElement('div');col.className='m-col';
  const bubble=document.createElement('div');bubble.className='m-bubble';bubble.textContent=text;
  const time=document.createElement('div');time.className='m-time';time.textContent=nowTime();
  col.appendChild(bubble);col.appendChild(time);
  if(streaming){const c=document.createElement('span');c.className='typing-cursor';bubble.appendChild(c);}
  wrap.appendChild(av);wrap.appendChild(col);
  box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  return bubble;
}

async function newSession(){
  const customerNo=$('customerNo').value.trim()||'CUS00000001';
  try{
    const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({customer_no:customerNo,channel_code:'MOBILE_BANK'})});
    currentSession=r.data.session_id;
    $('sidLabel').textContent=currentSession;
    const m=$('messages');m.innerHTML='';delete m.dataset.hasMsg;
    log('<span class="debug-tag">[session]</span> 创建 <span class="debug-tag">'+currentSession+'</span>');
    await loadSessions();await refreshState();
  }catch(e){log('创建会话失败：'+esc(e.message));alert(e.message);}
}

function filterSessions(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.session-item').forEach(el=>{
    el.style.display='';
    if(q&&!el.dataset.sid.toLowerCase().includes(q)&&!el.querySelector('.sess-title').textContent.toLowerCase().includes(q)){
      el.style.opacity='0.35';
    }else{el.style.opacity='1';}
  });
}

async function loadSessions(){
  const customerNo=$('customerNo').value.trim()||'CUS00000001';
  try{
    const r=await api('/api/customers/'+customerNo+'/sessions');
    const box=$('sessionList');box.innerHTML='';
    const list=r.data||[];
    $('sessionCount').textContent=list.length;
    if(!list.length){box.innerHTML='<div class="empty-tip">暂无会话</div>';return;}
    for(const s of list){
      const d=document.createElement('div');d.className='session-item'+(s.session_id===currentSession?' active':'');
      d.dataset.sid=s.session_id;
      const relTime=timeAgo((s.updated_at||'').replace('T',' '));
      d.innerHTML='<div class="sess-avatar">'+s.session_id.slice(0,2).toUpperCase()+'</div><div class="sess-body"><div class="sess-title">会话 '+s.session_id.slice(0,8)+'</div><div class="sess-time">'+relTime+'</div></div>';
      d.onclick=()=>selectSession(s.session_id);
      box.appendChild(d);
    }
    filterSessions($('sessionSearch').value);
  }catch(e){log('加载会话失败：'+esc(e.message));}
}

async function selectSession(id){
  currentSession=id;$('sidLabel').textContent=id;
  const m=$('messages');m.innerHTML='';delete m.dataset.hasMsg;
  try{
    const r=await api('/api/sessions/'+id+'/messages?page_no=1&page_size=50');
    const list=(r.data.list||[]);
    if(!list.length)renderWelcome();else list.forEach(x=>addMsg(x.sender==='user'?'user':'bot',x.content,false));
    await loadSessions();await refreshState();
  }catch(e){log('加载历史失败：'+esc(e.message));}
}

function stateCard(title,icon,html){return '<div class="state-card"><div class="state-card-head">'+icon+esc(title)+'</div><div class="state-card-body">'+html+'</div></div>';}
const ICON={
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  flow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H4z"/><path d="M8 20h8"/></svg>',
  stack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/></svg>',
  context:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'
};

async function refreshState(){
  if(!currentSession)return;
  try{
    const d=(await api('/api/sessions/'+currentSession+'/state')).data;
    const p=$('statePanel');p.innerHTML='';
    const ctx=d.context||{};
    const initials=(ctx.customer_name||d.customer_no||'?').slice(0,1).toUpperCase();
    const customerHtml=(
      '<div class="cust-header">'+
        '<div class="cust-avatar">'+initials+'</div>'+
        '<div><div class="cust-name">'+esc(ctx.customer_name||'—')+'</div><div class="cust-id">'+esc(d.customer_no||'-')+'</div></div>'+
      '</div>'+
      '<div class="kv-row"><span class="kv-k">客户状态</span><span class="kv-v '+(ctx.customer_status==='normal'?'ok':'warn')+'">'+esc(ctx.customer_status||'-')+'</span></div>'+
      (ctx.risk_level?'<div class="kv-row"><span class="kv-k">风险等级</span><span class="kv-v">'+esc(ctx.risk_level)+'</span></div>':'')
    );
    p.insertAdjacentHTML('beforeend',stateCard('客户信息',ICON.user,customerHtml));
    const at=d.active_task;
    if(at){
      const flowName=FLOW_NAMES[at.flow_id]||at.flow_id;
      const slotKeys=Object.keys(at.slots||{});
      let slotHtml='';
      for(const k of slotKeys){slotHtml+='<div class="slot-chip filled"><span class="sl">'+esc(SLOT_LABELS[k]||k)+'</span><span class="sv">'+esc(at.slots[k])+'</span></div>';}
      const taskHtml='<div class="flow-badge">'+esc(flowName)+'</div>'+
        (slotHtml?'<div class="slots-wrap">'+slotHtml+'</div>':'<div style="font-size:12px;color:var(--ink-faint);margin-top:8px;font-style:italic">正在收集信息…</div>');
      p.insertAdjacentHTML('beforeend',stateCard('进行中任务',ICON.flow,taskHtml));
    }else{
      p.insertAdjacentHTML('beforeend',stateCard('进行中任务',ICON.flow,'<div class="empty-state" style="padding:6px">无进行中的任务</div>'));
    }
    const stack=d.task_stack||[];
    if(stack.length){
      const stackHtml=stack.map(t=>'<div style="font-size:12px;padding:5px 0;color:var(--ink-mid);border-bottom:1px solid var(--rule-light);display:flex;align-items:center;gap:6px">'+ICON.stack+' <span style="margin-left:2px">⏸ '+esc(FLOW_NAMES[t.flow_id]||t.flow_id)+'</span></div>').join('');
      p.insertAdjacentHTML('beforeend',stateCard('挂起队列',ICON.stack,stackHtml));
    }
    if(ctx&&Object.keys(ctx).length){
      const ctxHtml=Object.entries(ctx).map(([k,v])=>'<div class="kv-row"><span class="kv-k">'+esc(k)+'</span><span class="kv-v">'+esc(String(v))+'</span></div>').join('');
      p.insertAdjacentHTML('beforeend',stateCard('上下文',ICON.context,ctxHtml));
    }
  }catch(e){log('刷新状态失败：'+esc(e.message));}
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

async function send(){
  if(!currentSession){alert('请先新建会话');return;}
  if(streaming)return;
  const input=$('msgInput');const text=input.value.trim();if(!text)return;
  input.value='';addMsg('user',text,false);
  await streamChat(text);
}

async function streamChat(text){
  streaming=true;$('sendBtn').classList.add('loading');$('sendBtn').disabled=true;
  const body=addMsg('bot','',true);
  let acc='';
  const rid='web-'+Date.now()+'-'+(++reqSeq);
  try{
    const resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','X-Request-Id':rid},body:JSON.stringify({session_id:currentSession,message:text,message_type:'text'})});
    const reader=resp.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);
        const line=chunk.trim();
        if(line.startsWith('data: ')){
          const ev=JSON.parse(line.slice(6));
          if(ev.type==='status')log('<span class="debug-tag">['+ev.stage+']</span> '+esc(ev.message));
          else if(ev.type==='tool')log('<span class="debug-tag">[tool]</span> '+esc(ev.name));
          else if(ev.type==='delta'){acc+=ev.text;body.textContent=acc;body.scrollIntoView({block:'nearest'});}
          else if(ev.type==='done'){
            body.querySelector('.typing-cursor')?.remove();
            if(!acc&&ev.messages&&ev.messages[0]){acc=ev.messages[0].text;body.textContent=acc;}
            if(ev.tools&&ev.tools.length){
              const tl=document.createElement('div');tl.className='tool-badge';tl.textContent='调用：'+ev.tools.join(' · ');
              body.parentElement.appendChild(tl);
            }
            log('<span class="debug-tag">trace</span> '+esc(ev.trace_id||''));
            if(ev.intent)log('<span class="debug-tag">intent</span> '+esc(JSON.stringify(ev.intent)));
          }else if(ev.type==='error'){body.textContent='错误：'+esc(ev.message);log('错误：'+esc(ev.message));}
        }
      }
    }
  }catch(e){body.querySelector('.typing-cursor')?.remove();body.textContent='请求失败：'+esc(e.message);log('请求失败：'+esc(e.message));}
  streaming=false;$('sendBtn').classList.remove('loading');$('sendBtn').disabled=false;
  await refreshState();
}

async function sendObject(object_type,id,title,account_no){
  if(!currentSession){alert('请先新建会话');return;}
  const payload={id,title,object_type,card_no:id,account_no};
  addMsg('user','[插入 '+title+' 卡片]',false);
  const rid='web-'+Date.now()+'-'+(++reqSeq);
  try{
    const r=await api('/api/chat',{method:'POST',body:JSON.stringify({session_id:currentSession,message_type:'business_object',payload})});
    const texts=(r.data.messages||[]).map(m=>m.text).join('\n');
    addMsg('bot',texts,false);
    log('<span class="debug-tag">[object]</span> 预填：'+esc(account_no));
  }catch(e){addMsg('bot','错误：'+esc(e.message),false);}
  await refreshState();
}

renderWelcome();
</script>
</body>
</html>
