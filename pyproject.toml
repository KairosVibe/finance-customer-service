[project]
name = "customer-service"
version = "0.1.0"
description = "金融智能客服系统（基于 dialoguekit 通用对话框架）"
requires-python = ">=3.12"
dependencies = [
    "dialoguekit",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "aiomysql>=0.3.2",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "sentence-transformers>=2.3.0",
]

[tool.uv.sources]
dialoguekit = { path = "vendor/dialoguekit" }

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001", "S110", "S112", "DTZ005"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]


